name: Bug report
description: Something is not working
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Never paste credentials.** Not your Proton password, not the bridge
        password, not the master password of the credentials file. Logs and
        error messages can contain them too, so read what you paste before you
        paste it.

        **Never paste mail content**, and that includes what looks harmless.
        Subject lines, addresses and folder names say more about you than you
        might expect. A path like `Folders/Banking/...` names your bank.

        Found a security problem? Do not open a public issue. See
        [the security policy](https://github.com/RndmJoker/proton-mcp/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered. Name the tool that was called if you know it.
      placeholder: |
        1. Start the server with ...
        2. Ask the assistant to ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error message if you have one, with anything private removed.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of this server, or the commit if you built it from source.
      placeholder: "0.2.0"

  - type: input
    id: bridge-version
    attributes:
      label: Bridge version
      description: Shown in the Bridge application, for example 3.25.0.

  - type: input
    id: client
    attributes:
      label: MCP client
      description: Which client is the server registered with?
      placeholder: "Claude Desktop, Claude Code, Cursor, ..."

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: This report contains no passwords, tokens, mail content, addresses or folder names.
          required: true

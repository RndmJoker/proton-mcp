title = "proton-mcp gitleaks config"

# A config file REPLACES the built-in rules, it does not add to them. Without
# the extend block below this file would define zero rules, and every scan
# would report a clean result no matter what the commit contains.
#
# Measured on 2026-07-30 with the same test token in the same file: without the
# block "no leaks found", with it "leaks found: 1". The allowlist keeps working
# either way.
[extend]
useDefault = true

# The check matters more here than in most projects. A bridge password
# committed by accident does not just look careless, it hands over an entire
# mailbox. Only files that cannot hold a real value are excluded.
#
# __tests__ is deliberately not excluded. Test fixtures are exactly where a
# real value from a debugging session ends up by accident, so that is the last
# directory to stop looking at.

[allowlist]
paths = [
  '''\.env\.example''',
  '''package-lock\.json''',
]

# The public key in extension/wxt.config.ts fixes the id of the browser
# extension, the only one the connector lets in. It is public by design:
# Chrome puts it into the manifest of every copy. gitleaks reads it as a
# generic API key. Allowed by its exact value, so any other value in that file,
# down to a single changed character, is still caught.
regexes = [
  '''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqnHPw9/scOh99eUli3fI/nWI\+nS/lDGWSiLZkTbM0D0VeT8V/jsh6HkkGS\+N9pUlP29RJiNuB2/HqLH7Vq4CY6IZXr5mgVeFIJ5bbkMNO/ba7YVK\+n3pvCYsT2BWX1XFJV5WlgnCRVknWUW2ss9poeTmywcgd4bwpRzTAle9auI8wX/614wKJQKi4RxAa8c/6IeV3XIuGKuRjR4yNyz8B7TkXXbAj1pKhGMeJQxW58JG4OIuZOHDawuajf\+BI2dEWHPLCfnBaVXwi0NGSSvA\+EaIZ/Xk9fKVGdyv75vmNrJ6tkykjwcIVlcziKXiratcH7nqDdQk8WJR2s4EC6hWdQIDAQAB$''',
]
